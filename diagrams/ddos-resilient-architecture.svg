<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Local educational lab architecture</title><desc id="desc">Three independent profiles: Nginx edge to backend; NestJS with process-local counters; two Express apps sharing Redis. Host ports bind only to 127.0.0.1. No CDN, DNS proxy, WAF, queue or database is deployed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker><style>.label{font:700 20px Arial,sans-serif;fill:#0f172a}.small{font:16px Arial,sans-serif;fill:#475569}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="700" fill="#f8fafc"/>
<text x="60" y="58" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Local DDoS Defense Lab</text>
<text x="60" y="88" class="small">Independent scenarios: application limits, not volumetric attack mitigation.</text>
<rect x="40" y="112" width="1120" height="530" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
<text x="65" y="145" class="small">Host access: 127.0.0.1 only</text>
<rect x="70" y="175" width="230" height="82" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="185" y="207" text-anchor="middle" class="label">HTTP :8080</text><text x="185" y="233" text-anchor="middle" class="small">Profile: nginx</text><rect x="400" y="175" width="230" height="82" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="515" y="207" text-anchor="middle" class="label">Nginx edge</text><text x="515" y="233" text-anchor="middle" class="small">Per-IP leaky bucket</text><rect x="770" y="175" width="290" height="82" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="915" y="207" text-anchor="middle" class="label">Node backend :8000</text><text x="915" y="233" text-anchor="middle" class="small">Internal only; no limiter</text><rect x="70" y="320" width="230" height="82" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="185" y="352" text-anchor="middle" class="label">HTTP :3000</text><text x="185" y="378" text-anchor="middle" class="small">Profile: nestjs</text><rect x="400" y="320" width="290" height="82" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="545" y="352" text-anchor="middle" class="label">NestJS</text><text x="545" y="378" text-anchor="middle" class="small">Per-route / process memory</text><rect x="70" y="465" width="230" height="82" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="185" y="497" text-anchor="middle" class="label">HTTP :3001 / :3002</text><text x="185" y="523" text-anchor="middle" class="small">Profile: redis</text><rect x="400" y="435" width="290" height="82" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="545" y="467" text-anchor="middle" class="label">Express app A :3001</text><text x="545" y="493" text-anchor="middle" class="small">Shared fixed-window budget</text><rect x="400" y="535" width="290" height="82" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="545" y="567" text-anchor="middle" class="label">Express app B :3001</text><text x="545" y="593" text-anchor="middle" class="small">Same Redis key namespace</text><rect x="850" y="485" width="230" height="82" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="965" y="517" text-anchor="middle" class="label">Redis :6379</text><text x="965" y="543" text-anchor="middle" class="small">Lua + expiry; internal only</text><path class="line" d="M300 216H400 M630 216H770 M300 361H400 M300 506L400 476 M300 506L400 576 M690 476L850 510 M690 576L850 544"/><text x="60" y="676" class="small">No authentication, TLS, CDN/WAF, scrubbing, queue or database is included. Health probes bypass budgets.</text></svg>