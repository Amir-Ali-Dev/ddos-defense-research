<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">DDoS-resilient web architecture</title>
  <desc id="desc">Layered defensive architecture from internet traffic through DNS, CDN, WAF, rate limiting, load balancing, application, cache, queue, and database layers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 10; }
      .edge { fill: #ecfeff; stroke: #0891b2; }
      .protect { fill: #f0fdf4; stroke: #16a34a; }
      .origin { fill: #fff7ed; stroke: #ea580c; }
      .data { fill: #f5f3ff; stroke: #7c3aed; }
      .text { font-family: Arial, sans-serif; fill: #0f172a; font-size: 18px; font-weight: 700; }
      .small { font-family: Arial, sans-serif; fill: #475569; font-size: 13px; }
      .label { font-family: Arial, sans-serif; fill: #0f172a; font-size: 14px; font-weight: 700; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text x="60" y="58" class="text" font-size="28">DDoS-Resilient Architecture</text>
  <text x="60" y="84" class="small">Absorb, filter, limit, and degrade before traffic reaches critical origin services.</text>

  <rect x="55" y="135" width="150" height="92" class="box"/>
  <text x="130" y="170" text-anchor="middle" class="label">Internet</text>
  <text x="130" y="195" text-anchor="middle" class="small">users + hostile</text>

  <rect x="250" y="135" width="150" height="92" class="box edge"/>
  <text x="325" y="166" text-anchor="middle" class="label">Anycast DNS</text>
  <text x="325" y="192" text-anchor="middle" class="small">resilient routing</text>

  <rect x="445" y="135" width="150" height="92" class="box edge"/>
  <text x="520" y="166" text-anchor="middle" class="label">CDN Edge</text>
  <text x="520" y="192" text-anchor="middle" class="small">cache + TLS</text>

  <rect x="640" y="135" width="150" height="92" class="box protect"/>
  <text x="715" y="166" text-anchor="middle" class="label">WAF / Bot</text>
  <text x="715" y="192" text-anchor="middle" class="small">challenge + block</text>

  <rect x="835" y="135" width="150" height="92" class="box protect"/>
  <text x="910" y="166" text-anchor="middle" class="label">Rate Limit</text>
  <text x="910" y="192" text-anchor="middle" class="small">IP / user / route</text>

  <rect x="445" y="315" width="150" height="92" class="box origin"/>
  <text x="520" y="346" text-anchor="middle" class="label">Load Balancer</text>
  <text x="520" y="372" text-anchor="middle" class="small">connection control</text>

  <rect x="640" y="315" width="150" height="92" class="box origin"/>
  <text x="715" y="346" text-anchor="middle" class="label">API Gateway</text>
  <text x="715" y="372" text-anchor="middle" class="small">auth + routing</text>

  <rect x="835" y="315" width="150" height="92" class="box origin"/>
  <text x="910" y="346" text-anchor="middle" class="label">Application</text>
  <text x="910" y="372" text-anchor="middle" class="small">backpressure</text>

  <rect x="640" y="500" width="150" height="92" class="box data"/>
  <text x="715" y="532" text-anchor="middle" class="label">Cache</text>
  <text x="715" y="558" text-anchor="middle" class="small">reduce origin cost</text>

  <rect x="835" y="500" width="150" height="92" class="box data"/>
  <text x="910" y="532" text-anchor="middle" class="label">Queue</text>
  <text x="910" y="558" text-anchor="middle" class="small">smooth bursts</text>

  <rect x="1030" y="500" width="120" height="92" class="box data"/>
  <text x="1090" y="532" text-anchor="middle" class="label">Database</text>
  <text x="1090" y="558" text-anchor="middle" class="small">protected</text>

  <rect x="55" y="500" width="250" height="92" class="box protect"/>
  <text x="180" y="532" text-anchor="middle" class="label">Observability + IR</text>
  <text x="180" y="558" text-anchor="middle" class="small">metrics, logs, runbooks</text>

  <rect x="55" y="315" width="250" height="92" class="box protect"/>
  <text x="180" y="346" text-anchor="middle" class="label">ISP / Scrubbing</text>
  <text x="180" y="372" text-anchor="middle" class="small">upstream volumetric mitigation</text>

  <path d="M205 181 L250 181" class="arrow"/>
  <path d="M400 181 L445 181" class="arrow"/>
  <path d="M595 181 L640 181" class="arrow"/>
  <path d="M790 181 L835 181" class="arrow"/>
  <path d="M910 227 C910 270 520 270 520 315" class="arrow"/>
  <path d="M595 361 L640 361" class="arrow"/>
  <path d="M790 361 L835 361" class="arrow"/>
  <path d="M910 407 L910 500" class="arrow"/>
  <path d="M985 546 L1030 546" class="arrow"/>
  <path d="M835 546 L790 546" class="arrow"/>
  <path d="M305 361 C375 361 375 181 445 181" class="dash"/>
  <path d="M305 546 C455 546 455 500 640 500" class="dash"/>
  <path d="M305 546 C520 640 890 640 1090 592" class="dash"/>
</svg>
