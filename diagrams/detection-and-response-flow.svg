<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
  <title id="title">DDoS detection and response flow</title>
  <desc id="desc">Decision flow for classifying DDoS pressure and routing mitigation actions to the right layer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 10; }
      .warn { fill: #fff7ed; stroke: #f97316; }
      .net { fill: #ecfeff; stroke: #0891b2; }
      .app { fill: #f0fdf4; stroke: #16a34a; }
      .data { fill: #f5f3ff; stroke: #7c3aed; }
      .text { font-family: Arial, sans-serif; fill: #0f172a; font-size: 22px; font-weight: 700; }
      .label { font-family: Arial, sans-serif; fill: #0f172a; font-size: 15px; font-weight: 700; }
      .small { font-family: Arial, sans-serif; fill: #475569; font-size: 12px; }
      .arrow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1100" height="680"/>
  <text x="60" y="58" class="text">Detection And Response Flow</text>
  <text x="60" y="84" class="small">Classify the bottleneck first, then apply the narrowest effective mitigation.</text>

  <rect x="430" y="125" width="240" height="78" class="box warn"/>
  <text x="550" y="156" text-anchor="middle" class="label">Alert / User Impact</text>
  <text x="550" y="180" text-anchor="middle" class="small">latency, errors, saturation</text>

  <rect x="405" y="260" width="290" height="86" class="box"/>
  <text x="550" y="293" text-anchor="middle" class="label">Which capacity is exhausted?</text>
  <text x="550" y="318" text-anchor="middle" class="small">network, state, HTTP, app, or data</text>

  <rect x="70" y="430" width="210" height="88" class="box net"/>
  <text x="175" y="462" text-anchor="middle" class="label">Network Volume</text>
  <text x="175" y="486" text-anchor="middle" class="small">bps, pps, upstream link</text>

  <rect x="320" y="430" width="210" height="88" class="box net"/>
  <text x="425" y="462" text-anchor="middle" class="label">Protocol State</text>
  <text x="425" y="486" text-anchor="middle" class="small">SYN, connections, TLS</text>

  <rect x="570" y="430" width="210" height="88" class="box app"/>
  <text x="675" y="462" text-anchor="middle" class="label">HTTP / API</text>
  <text x="675" y="486" text-anchor="middle" class="small">RPS, paths, WAF events</text>

  <rect x="820" y="430" width="210" height="88" class="box data"/>
  <text x="925" y="462" text-anchor="middle" class="label">App / Data Tier</text>
  <text x="925" y="486" text-anchor="middle" class="small">workers, queues, DB</text>

  <rect x="70" y="575" width="210" height="60" class="box"/>
  <text x="175" y="602" text-anchor="middle" class="label">Scrub / ISP / CDN</text>
  <text x="175" y="622" text-anchor="middle" class="small">filter before origin</text>

  <rect x="320" y="575" width="210" height="60" class="box"/>
  <text x="425" y="602" text-anchor="middle" class="label">Edge Tuning</text>
  <text x="425" y="622" text-anchor="middle" class="small">limits, SYN, TLS offload</text>

  <rect x="570" y="575" width="210" height="60" class="box"/>
  <text x="675" y="602" text-anchor="middle" class="label">WAF + Rate Limit</text>
  <text x="675" y="622" text-anchor="middle" class="small">challenge scoped traffic</text>

  <rect x="820" y="575" width="210" height="60" class="box"/>
  <text x="925" y="602" text-anchor="middle" class="label">Degrade Safely</text>
  <text x="925" y="622" text-anchor="middle" class="small">cache, queue, protect DB</text>

  <path d="M550 203 L550 260" class="arrow"/>
  <path d="M550 346 C550 390 175 390 175 430" class="arrow"/>
  <path d="M550 346 C550 390 425 390 425 430" class="arrow"/>
  <path d="M550 346 C550 390 675 390 675 430" class="arrow"/>
  <path d="M550 346 C550 390 925 390 925 430" class="arrow"/>
  <path d="M175 518 L175 575" class="arrow"/>
  <path d="M425 518 L425 575" class="arrow"/>
  <path d="M675 518 L675 575" class="arrow"/>
  <path d="M925 518 L925 575" class="arrow"/>
</svg>
