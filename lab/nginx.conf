worker_processes 1;
events { worker_connections 256; }
http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    limit_req_zone $binary_remote_addr zone=public:1m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=login:1m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    upstream demo { server backend:8000; }
    server {
        listen 80;
        limit_req_status 429;
        limit_conn_status 429;
        limit_conn connections 20;
        error_page 429 = @limited;
        proxy_set_header Host $host;
        # This edge does not trust inbound forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        location = /healthz { access_log off; return 200 'ok'; }
        location = /auth/login {
            limit_req zone=login burst=1 nodelay;
            proxy_pass http://demo;
        }
        location / {
            limit_req zone=public burst=2 nodelay;
            proxy_pass http://demo;
        }
        location @limited {
            default_type application/json;
            add_header Retry-After 1 always;
            add_header Cache-Control no-store always;
            return 429 '{"error":"too_many_requests"}';
        }
    }
}
