# Standalone nginx.conf example: nginx -t -c /path/to/rate-limit.conf
events { worker_connections 1024; }
http {
    limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;
    limit_req_zone $binary_remote_addr zone=public:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
    # No arbitrary Authorization/API key is treated as an authenticated identity.
    upstream app_backend { server 127.0.0.1:3000; keepalive 16; }
    server {
        listen 8080;
        server_name localhost;
        limit_conn per_ip_conn 40;
        limit_conn_status 429;
        limit_req_status 429;
        error_page 429 = @limited;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        location = /auth/login {
            limit_req zone=login burst=1 nodelay;
            proxy_pass http://app_backend;
        }
        location / {
            limit_req zone=public burst=40 nodelay;
            proxy_pass http://app_backend;
        }
        location @limited {
            default_type application/json;
            add_header Retry-After 1 always;
            add_header Cache-Control no-store always;
            return 429 '{"error":"too_many_requests"}';
        }
    }
}
