# Defensive Nginx rate limiting template.
# Place the http-level blocks inside nginx.conf, then adapt upstreams and paths.

http {
    log_format ddos_defense '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'rt=$request_time ua="$upstream_addr" '
                            'urt="$upstream_response_time"';

    # Per-client connection cap.
    limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;

    # General public traffic.
    limit_req_zone $binary_remote_addr zone=public_per_ip:20m rate=20r/s;

    # Sensitive authentication endpoints.
    limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=5r/m;

    # API traffic. Prefer API key or authenticated user id when available.
    map $http_authorization $api_rate_key {
        default $http_authorization;
        ""      $binary_remote_addr;
    }
    limit_req_zone $api_rate_key zone=api_per_identity:30m rate=30r/s;

    upstream app_backend {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=15s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name example.com;

        access_log /var/log/nginx/access.log ddos_defense;
        error_log  /var/log/nginx/error.log warn;

        limit_conn per_ip_conn 40;
        limit_req_status 429;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location / {
            limit_req zone=public_per_ip burst=60 nodelay;
            proxy_pass http://app_backend;
        }

        location = /auth/login {
            limit_req zone=login_per_ip burst=10 nodelay;
            proxy_pass http://app_backend;
        }

        location /api/ {
            limit_req zone=api_per_identity burst=90 nodelay;
            proxy_pass http://app_backend;
        }

        location /admin/ {
            allow 203.0.113.0/24;
            deny all;
            limit_req zone=login_per_ip burst=5 nodelay;
            proxy_pass http://app_backend;
        }
    }
}
