<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760" role="img" aria-labelledby="title desc">
  <title id="title">Repository visual overview</title>
  <desc id="desc">A visual grid summarizing the repository sections.</desc>
  <rect width="1300" height="760" fill="#f8fafc"/>
  <text x="70" y="70" font-family="Arial,sans-serif" font-size="36" font-weight="800" fill="#0f172a">Repository Visual Overview</text>
  <g font-family="Arial,sans-serif">
    <rect x="70" y="120" width="360" height="190" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
    <text x="105" y="175" font-size="26" font-weight="800" fill="#0f172a">Architecture</text>
    <text x="105" y="220" font-size="18" fill="#334155">CDN, WAF, rate limits, origin isolation</text>
    <rect x="470" y="120" width="360" height="190" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <text x="505" y="175" font-size="26" font-weight="800" fill="#0f172a">Detection</text>
    <text x="505" y="220" font-size="18" fill="#334155">Signals, baselines, response flow</text>
    <rect x="870" y="120" width="360" height="190" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="905" y="175" font-size="26" font-weight="800" fill="#0f172a">Mitigation</text>
    <text x="905" y="220" font-size="18" fill="#334155">Scrubbing, cache, controls, backpressure</text>
    <rect x="70" y="350" width="360" height="190" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
    <text x="105" y="405" font-size="26" font-weight="800" fill="#0f172a">Examples</text>
    <text x="105" y="450" font-size="18" fill="#334155">Nginx, NestJS, Redis, Cloudflare</text>
    <rect x="470" y="350" width="360" height="190" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="505" y="405" font-size="26" font-weight="800" fill="#0f172a">Case Studies</text>
    <text x="505" y="450" font-size="18" fill="#334155">GitHub 2018, Rapid Reset, Mirai</text>
    <rect x="870" y="350" width="360" height="190" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <text x="905" y="405" font-size="26" font-weight="800" fill="#0f172a">Safe Lab</text>
    <text x="905" y="450" font-size="18" fill="#334155">Local Docker/Nginx defensive config</text>
  </g>
  <text x="70" y="660" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#334155">Defensive only: no attack tooling, no traffic generators, no offensive procedures.</text>
</svg>
