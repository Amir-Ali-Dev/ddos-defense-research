<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760" role="img" aria-labelledby="title desc">
  <title id="title">Repository visual overview</title>
  <desc id="desc">A visual grid summarizing the repository sections.</desc>
  <defs>
    <style>
      .font{font-family:"Segoe UI",Inter,system-ui,Arial,sans-serif}.h{font-size:36px;font-weight:850;fill:#0f172a}.t{font-size:27px;font-weight:850;fill:#0f172a}.s{font-size:18px;fill:#334155}.m{font-size:22px;font-weight:750;fill:#334155}
    </style>
  </defs>
  <rect width="1300" height="760" fill="#f8fafc"/>
  <text x="70" y="70" class="font h">Repository Visual Overview</text>
  <g class="font">
    <rect x="70" y="118" width="360" height="190" rx="20" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
    <text x="105" y="174" class="t">Architecture</text>
    <text x="105" y="218" class="s">CDN, WAF, rate limits</text>
    <text x="105" y="248" class="s">and origin isolation</text>
    <rect x="470" y="118" width="360" height="190" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <text x="505" y="174" class="t">Detection</text>
    <text x="505" y="218" class="s">Signals, baselines</text>
    <text x="505" y="248" class="s">and response flow</text>
    <rect x="870" y="118" width="360" height="190" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="905" y="174" class="t">Mitigation</text>
    <text x="905" y="218" class="s">Scrubbing, cache</text>
    <text x="905" y="248" class="s">and backpressure</text>
    <rect x="70" y="350" width="360" height="190" rx="20" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
    <text x="105" y="406" class="t">Examples</text>
    <text x="105" y="450" class="s">Nginx, NestJS</text>
    <text x="105" y="480" class="s">Redis and Cloudflare</text>
    <rect x="470" y="350" width="360" height="190" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="505" y="406" class="t">Case Studies</text>
    <text x="505" y="450" class="s">GitHub 2018</text>
    <text x="505" y="480" class="s">Rapid Reset and Mirai</text>
    <rect x="870" y="350" width="360" height="190" rx="20" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <text x="905" y="406" class="t">Safe Lab</text>
    <text x="905" y="450" class="s">Local Docker/Nginx</text>
    <text x="905" y="480" class="s">defensive config</text>
  </g>
  <text x="70" y="660" class="font m">Defensive only: no attack tooling, no traffic generators, no offensive procedures.</text>
</svg>
